<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 392" width="592" height="392" role="img" aria-label="单个应用图标：5 个方向的隐藏手势">
  <rect x="1" y="1" width="590" height="390" rx="18" fill="#ffffff" stroke="#dce4e1" stroke-width="1.5"/>
  <rect x="16" y="14" width="89" height="24" rx="7" fill="#e6f5f0" stroke="#075848" stroke-opacity="0.3" stroke-width="1"/>
  <text x="60.5" y="30" font-size="11.5" fill="#075848" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">状态栏单图标</text>
  <text x="115" y="30.5" font-size="14.5" fill="#1a2120" text-anchor="start" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">单个应用图标：5 个方向的隐藏手势</text>
  <text x="18" y="52" font-size="11.5" fill="#586562" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">按住顶部状态栏中的任意单应用图标拖动，看松手位置落在虚线边界线哪个区域：</text>
  <line x1="16" y1="62" x2="576" y2="62" stroke="#edf2f0" stroke-width="1.2"/>
  <g transform="translate(16, 68)">
    <rect x="16" y="112" width="528" height="72" rx="12" fill="#24292e" stroke="#3a4148" stroke-width="1.2"/>
      <text x="30" y="132" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">顶部状态栏局部放大</text>

      <!-- Zone boxes cleanly outside dashed boundary area -->
      <rect x="18" y="12" width="186" height="74" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
      <text x="111" y="35" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↖ 超出左边界 + 上边界</text>
      <text x="111" y="55" font-size="13.5" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">在原位 / 原分栏强制重启</text>
      <text x="111" y="74" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">左栏重启，右栏继续跑不受影响</text>

      <rect x="18" y="204" width="178" height="86" rx="12" fill="#e6f5f0" stroke="#0d7a64" stroke-width="1.5"/>
      <text x="107" y="230" font-size="12" fill="#075848" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">← 保持高度，拖出左边界</text>
      <text x="107" y="252" font-size="14" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放进左侧分屏栏</text>
      <text x="107" y="272" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Y 坐标需留在图标上下线之间</text>

      <rect x="364" y="204" width="178" height="86" rx="12" fill="#e6f5f0" stroke="#0d7a64" stroke-width="1.5"/>
      <text x="453" y="230" font-size="12" fill="#075848" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">保持高度，拖出右边界 →</text>
      <text x="453" y="252" font-size="14" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">放进右侧分屏栏</text>
      <text x="453" y="272" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Y 坐标需留在图标上下线之间</text>

      <rect x="208" y="204" width="144" height="86" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <text x="280" y="230" font-size="12" fill="#e11d48" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓ 左右边界内向下</text>
      <text x="280" y="252" font-size="14" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">强制关闭该应用</text>
      <text x="280" y="272" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">若下有后台组合则自动切回</text>

      <rect x="330" y="12" width="212" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="436" y="35" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">👆 直接点击一下图标</text>
      <text x="436" y="55" font-size="13.5" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">切回全屏显示</text>
      <text x="436" y="74" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">若为分屏成员，会自动拆散组合</text>

      <!-- Center Target Icon & Boundary Guides -->
      <line x1="248" y1="12" x2="248" y2="292" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/>
      <line x1="312" y1="12" x2="312" y2="292" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5 4"/>
      <line x1="32" y1="120" x2="528" y2="120" stroke="#0d7a64" stroke-width="1.3" stroke-dasharray="5 4"/>
      <line x1="32" y1="176" x2="528" y2="176" stroke="#0d7a64" stroke-width="1.3" stroke-dasharray="5 4"/>
      <rect x="248" y="120" width="64" height="56" rx="13" fill="#0f766e" stroke="#fff" stroke-width="2"/>
      <text x="280" y="156" font-size="24" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text>

      <!-- Crisp non-overlapping Arrows ending cleanly outside boxes -->
      <path d="M258 128 L194 90" fill="none" stroke="#d97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M194 90 L207 90 M194 90 L200 101" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M246 148 L120 148 L120 200" fill="none" stroke="#0d7a64" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 191 L120 201 L126 191" fill="none" stroke="#0d7a64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M314 148 L440 148 L440 200" fill="none" stroke="#0d7a64" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M434 191 L440 201 L446 191" fill="none" stroke="#0d7a64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M280 176 L280 200" fill="none" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M274 191 L280 201 L286 191" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
