<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 332" width="912" height="332" role="img" aria-label="把手机变成「外接大屏安卓盒子」">
  <rect x="1" y="1" width="910" height="330" rx="18" fill="#ffffff" stroke="#dce4e1" stroke-width="1.5"/>
  <rect x="16" y="14" width="89" height="24" rx="7" fill="#e6f5f0" stroke="#075848" stroke-opacity="0.3" stroke-width="1"/>
  <text x="60.5" y="30" font-size="11.5" fill="#075848" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">双屏核心架构</text>
  <text x="115" y="30.5" font-size="14.5" fill="#1a2120" text-anchor="start" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">把手机变成「外接大屏安卓盒子」</text>
  <text x="18" y="52" font-size="11.5" fill="#586562" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">不是画面镜像，而是让应用独立运行在外接显示器；连接鼠标后手机自动黑屏省电，轻触手机随时恢复</text>
  <line x1="16" y1="62" x2="896" y2="62" stroke="#edf2f0" stroke-width="1.2"/>
  <g transform="translate(16, 68)">
    <defs>
      <marker id="hArr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#0d7a64" stroke-width="1.6"/></marker>
      <marker id="hBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker>
    </defs>
    <!-- Phone Zone -->
    <rect x="18" y="14" width="178" height="218" rx="22" fill="#f8faf9" stroke="#cfd8d5" stroke-width="1.5"/>
    <rect x="26" y="22" width="162" height="202" rx="16" fill="#1f2625" stroke="#36413f" stroke-width="1.2"/>
    <rect x="82" y="27" width="50" height="5" rx="3" fill="#36413f" stroke="none" stroke-width="1.2"/>
    <text x="107" y="54" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">手机（控制端）</text>
    <text x="107" y="72" font-size="10.5" fill="#99b2ac" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">Shizuku + BoxScreen</text>
    <rect x="38" y="86" width="138" height="44" rx="9" fill="#2a3533" stroke="#455854" stroke-width="1"/>
    <text x="107" y="105" font-size="11" fill="#5eead4" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">● 点选应用启动</text>
    <text x="107" y="121" font-size="10" fill="#cbd5e1" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">连鼠标后自动黑屏省电</text>
    <rect x="38" y="140" width="66" height="34" rx="8" fill="#2a3533" stroke="#455854" stroke-width="1"/><text x="71" y="161" font-size="10.5" fill="#e2e8f0" text-anchor="middle" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">影片 A</text>
    <rect x="110" y="140" width="66" height="34" rx="8" fill="#2a3533" stroke="#455854" stroke-width="1"/><text x="143" y="161" font-size="10.5" fill="#e2e8f0" text-anchor="middle" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">浏览器 B</text>
    <rect x="38" y="182" width="138" height="28" rx="8" fill="#153932" stroke="#0d7a64" stroke-width="1"/><text x="107" y="200" font-size="10.5" fill="#a7f3d0" text-anchor="middle" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">轻触手机随时唤醒</text>

    <!-- Center Cables & Peripherals -->
    <path d="M198 90 L386 90" fill="none" stroke="#0d7a64" stroke-width="2.6" marker-end="url(#hArr)"/>
    <rect x="226" y="54" width="136" height="28" rx="8" fill="#e6f5f0" stroke="#99d5c4" stroke-width="1"/>
    <text x="294" y="72" font-size="11.5" fill="#075848" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">USB-C 视频直出虚拟屏</text>

    <rect x="224" y="114" width="140" height="48" rx="11" fill="#fff" stroke="#cfd8d5" stroke-width="1.2"/>
    <g transform="translate(246,138) scale(1.15)">
    <rect x="-5.5" y="-7.5" width="11" height="15" rx="5.5" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    <line x1="0" y1="-7.5" x2="0" y2="-1.5" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="-5.5" y1="-1.5" x2="5.5" y2="-1.5" stroke="#2563eb" stroke-width="1.3"/>
  </g>
    <text x="262" y="134" font-size="11.5" fill="#1a2120" text-anchor="start" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">蓝牙 / USB 鼠标</text>
    <text x="262" y="150" font-size="10" fill="#586562" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">路由到大屏直接点控</text>
    <path d="M364 138 L386 138" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#hBlue)"/>

    <rect x="224" y="172" width="140" height="42" rx="11" fill="#fff" stroke="#cfd8d5" stroke-width="1.2"/>
    <text x="294" y="191" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">🎮 也支持外接游戏手柄</text>
    <text x="294" y="206" font-size="10" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">按键自动发往大屏焦点应用</text>

    <!-- External Monitor Zone -->
    <rect x="392" y="14" width="470" height="210" rx="16" fill="#1f2428" stroke="#374151" stroke-width="2"/>
    <rect x="570" y="224" width="114" height="8" rx="4" fill="#9ca3af" stroke="none" stroke-width="1.2"/>
    <rect x="535" y="232" width="184" height="8" rx="4" fill="#cbd5e1" stroke="none" stroke-width="1.2"/>
    <!-- Status bar -->
    <rect x="402" y="22" width="450" height="28" rx="6" fill="#24292e" stroke="#3a4148" stroke-width="1"/>
    <text x="414" y="40" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">14:32  80%</text>
    <line x1="478" y1="36" x2="544" y2="36" stroke="#64748b" stroke-width="2"/><circle cx="516" cy="36" r="4.5" fill="#14b8a6"/>
    <text x="554" y="40" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">顶部快捷条（悬停 0.1 秒唤出）</text>
    <rect x="731.36" y="27.72" width="12" height="12" rx="3" fill="#0f766e" stroke="#fff" stroke-width="1.2"/><text x="737.36" y="36.36" font-size="7" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><rect x="737.48" y="33.48" width="12" height="12" rx="3" fill="#2563eb" stroke="#fff" stroke-width="1.2"/><text x="743.48" y="42.12" font-size="7" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B</text>
    <rect x="758" y="28" width="16" height="16" rx="4" fill="#0f766e" stroke="rgba(255,255,255,.35)" stroke-width="1"/><text x="766" y="39.36" font-size="9" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><rect x="780" y="28" width="16" height="16" rx="4" fill="#2563eb" stroke="rgba(255,255,255,.35)" stroke-width="1"/><text x="788" y="39.36" font-size="9" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B</text><rect x="802" y="28" width="16" height="16" rx="4" fill="#d97706" stroke="rgba(255,255,255,.35)" stroke-width="1"/><text x="810" y="39.36" font-size="9" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C</text>
    <text x="836" y="41" font-size="16" fill="#f87171" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">×</text>

    <!-- Split screen content -->
    <rect x="404" y="56" width="220" height="158" rx="8" fill="#142321" stroke="#264642" stroke-width="1"/>
    <text x="514" y="94" font-size="14" fill="#5eead4" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">左栏：影片 A</text>
    <circle cx="514" cy="132" r="20" fill="#0d7a64" fill-opacity=".35" stroke="#5eead4" stroke-width="1.5"/>
    <path d="M508 123 L524 132 L508 141 Z" fill="#5eead4" stroke="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="514" y="188" font-size="10.5" fill="#99b2ac" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">独立尺寸运行 · 互不干扰</text>

    <rect x="630" y="56" width="220" height="158" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="642" y="66" width="196" height="24" rx="6" fill="#eef2f6" stroke="none" stroke-width="1.2"/><text x="652" y="82" font-size="10.5" fill="#586562" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">https://boxscreen.app</text>
    <text x="740" y="122" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">右栏：浏览器 B</text>
    <rect x="644" y="136" width="192" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/><text x="654" y="152" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">全屏 / 分屏自由切换</text>
    <rect x="644" y="168" width="192" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="654" y="184" font-size="10.5" fill="#586562" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">支持各自保存触摸或鼠标模式</text>

    <!-- Center floating split handle + clean badge above bottom border -->
    <rect x="623" y="72" width="8" height="38" rx="4" fill="#ffffff" stroke="#0d7a64" stroke-width="2"/>
    <rect x="575" y="196" width="104" height="20" rx="6" fill="#0f172a" stroke="#5eead4" stroke-width="1"/>
    <text x="627" y="210" font-size="10" fill="#5eead4" text-anchor="middle" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">中间滑块（靠近可见）</text>
  </g>
</svg>
