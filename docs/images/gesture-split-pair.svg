<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 392" width="592" height="392" role="img" aria-label="分屏组合图标 [A+B]：三向手势 &amp; 单图标并存">
  <rect x="1" y="1" width="590" height="390" rx="18" fill="#ffffff" stroke="#dce4e1" stroke-width="1.5"/>
  <rect x="16" y="14" width="117" height="24" rx="7" fill="#e6f5f0" stroke="#075848" stroke-opacity="0.3" stroke-width="1"/>
  <text x="74.5" y="30" font-size="11.5" fill="#075848" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">v1.0.19 组合图标</text>
  <text x="143" y="30.5" font-size="14.5" fill="#1a2120" text-anchor="start" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">分屏组合图标 [A+B]：三向手势 &amp; 单图标并存</text>
  <text x="18" y="52" font-size="11.5" fill="#586562" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">状态栏紧邻显示「交叠组合」与「A / B 单图标」，分别管整体切回拆散与单栏重启：</text>
  <line x1="16" y1="62" x2="576" y2="62" stroke="#edf2f0" stroke-width="1.2"/>
  <g transform="translate(16, 68)">
    <rect x="16" y="108" width="528" height="74" rx="12" fill="#24292e" stroke="#3a4148" stroke-width="1.2"/>
      <text x="30" y="138" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">状态栏</text>
      <text x="30" y="156" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">实际排列</text>

      <rect x="177" y="127" width="34" height="34" rx="9" fill="#d97706" stroke="rgba(255,255,255,.35)" stroke-width="1"/><text x="194" y="151.14" font-size="19" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">C</text>
      <text x="194" y="175" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">普通应用</text>

      <!-- Pair icon -->
      <rect x="248" y="116" width="74" height="56" rx="12" fill="#313940" stroke="#5eead4" stroke-width="1.6"/>
      <rect x="264.84" y="124.68" width="27" height="27" rx="8" fill="#0f766e" stroke="#fff" stroke-width="1.2"/><text x="278.34" y="144.12" font-size="17" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text><rect x="279.12" y="138.12" width="27" height="27" rx="8" fill="#2563eb" stroke="#fff" stroke-width="1.2"/><text x="292.62" y="157.56" font-size="17" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B</text>

      <!-- Individual A & B -->
      <rect x="338" y="120" width="50" height="48" rx="10" fill="#0f766e" stroke="#fff" stroke-width="1.4"/><text x="363" y="151" font-size="20" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">A</text>
      <rect x="398" y="120" width="50" height="48" rx="10" fill="#2563eb" stroke="#fff" stroke-width="1.4"/><text x="423" y="151" font-size="20" fill="#fff" text-anchor="middle" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">B</text>
      <text x="502" y="151" font-size="22" fill="#f87171" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">×</text>

      <!-- Rails for [A+B] -->
      <line x1="248" y1="12" x2="248" y2="290" stroke="#0d7a64" stroke-width="1.3" stroke-dasharray="5 4"/>
      <line x1="322" y1="12" x2="322" y2="290" stroke="#0d7a64" stroke-width="1.3" stroke-dasharray="5 4"/>

      <!-- Top Ungroup Box -->
      <rect x="166" y="12" width="238" height="74" rx="12" fill="#e6f5f0" stroke="#0d7a64" stroke-width="1.5"/>
      <text x="285" y="35" font-size="12" fill="#075848" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↑ 左右边界内向上拖出上沿</text>
      <text x="285" y="56" font-size="14.5" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">无损拆散组合</text>
      <text x="285" y="75" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不杀进程！各自变回独立任务</text>

      <!-- Bottom Kill Both Box -->
      <rect x="140" y="204" width="250" height="86" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
      <text x="265" y="230" font-size="12" fill="#e11d48" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">↓ 左右边界内向下拖出下沿</text>
      <text x="265" y="252" font-size="14" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">同时关闭 A 和 B 两个应用</text>
      <text x="265" y="273" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">均会被强制停止并清空任务</text>

      <!-- Left Click Box -->
      <rect x="16" y="12" width="138" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="85" y="36" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">👆 点交叠图标</text>
      <text x="85" y="57" font-size="13.5" fill="#1a2120" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">整体恢复分屏</text>
      <text x="85" y="76" font-size="11" fill="#586562" text-anchor="middle" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">适配当前横竖屏</text>
      <path d="M136 86 L244 134" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>

      <!-- Right Explanation Box -->
      <rect x="402" y="204" width="142" height="86" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
      <text x="473" y="227" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">旁边 A / B 的用处</text>
      <text x="473" y="249" font-size="11.5" fill="#1a2120" text-anchor="middle" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">• 左上拖：单栏重启</text>
      <text x="473" y="268" font-size="11.5" fill="#1a2120" text-anchor="middle" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">• 点击：拆散全屏看</text>
      <path d="M374 170 L430 204" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>

      <!-- Arrows -->
      <path d="M285 114 L285 88" fill="none" stroke="#0d7a64" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M279 97 L285 87 L291 97" fill="none" stroke="#0d7a64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M285 174 L285 201" fill="none" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M279 192 L285 202 L291 192" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
