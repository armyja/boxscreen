import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

plugins {
    id 'com.android.application'
}

abstract class CopyGuideAssetTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getSourceFile()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        File out = outputDir.get().asFile
        out.mkdirs()
        sourceFile.get().asFile.withInputStream { input ->
            new File(out, 'operation_guide_zh_cn.html').withOutputStream { output ->
                output << input
            }
        }
    }
}

def syncGuideAsset = tasks.register('syncGuideAsset', CopyGuideAssetTask) {
    sourceFile.set(rootProject.layout.projectDirectory.file('docs/OPERATION_GUIDE_zh-CN.html'))
    outputDir.set(layout.buildDirectory.dir('generated/guideAssets'))
}

def releaseSigningPropertiesFile = new File(System.getProperty('user.home'), '.gradle/boxscreen-release.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace 'com.armyja.boxscreen'
    compileSdk 36

    buildFeatures {
        aidl true
    }

    defaultConfig {
        applicationId 'com.armyja.boxscreen'
        minSdk 29
        targetSdk 35
        versionCode 24
        versionName '1.0.21'
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            if (releaseSigningPropertiesFile.exists()) {
                storeFile file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(syncGuideAsset, { it.outputDir })
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
